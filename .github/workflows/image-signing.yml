name: "Image Signing — Cosign + Sigstore"
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build-sign-verify:
    name: Build, Sign & Verify Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}:latest
            ghcr.io/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}:${{ github.sha }}

      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Generate SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom-cyclonedx.json \
            --type cyclonedx \
            ghcr.io/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}@${{ steps.build.outputs.digest }} || true
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository_owner | lower }}/${{ github.event.repository.name | lower }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Summary
        run: |
          echo "## Image Signing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | Docker Buildx | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Push | GHCR | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Sign | Cosign keyless | ✅ Signed |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify | Cosign verify | ✅ Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed via:** Sigstore Fulcio (keyless — no private key stored)" >> $GITHUB_STEP_SUMMARY
