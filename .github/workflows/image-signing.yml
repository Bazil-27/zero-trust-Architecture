name: "Image Signing — Cosign + Sigstore"

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]  # Trigger on version tags too

permissions:
  contents: read
  packages: write       # Push to GitHub Container Registry
  id-token: write       # Required for keyless Cosign signing

jobs:
  build-sign-verify:
    name: Build, Sign & Verify Container Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Install Cosign ────────────────────────────────────────────────────
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.4.0

      # ── Login to GitHub Container Registry ───────────────────────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Build Docker image ────────────────────────────────────────────────
      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      # ── Sign image — keyless via Sigstore (no private key needed) ─────────
      - name: Sign image with Cosign (keyless)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      # ── Generate SLSA provenance attestation ─────────────────────────────
      - name: Generate SBOM attestation
        run: |
          cosign attest --yes \
            --predicate sbom-cyclonedx.json \
            --type cyclonedx \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }} || true
        env:
          COSIGN_EXPERIMENTAL: "true"

      # ── Verify signature ──────────────────────────────────────────────────
      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_EXPERIMENTAL: "true"

      - name: Summary
        run: |
          echo "## Image Signing Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | Docker Buildx | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Push | GHCR | ✅ Done |" >> $GITHUB_STEP_SUMMARY
          echo "| Sign | Cosign keyless | ✅ Signed |" >> $GITHUB_STEP_SUMMARY
          echo "| Verify | Cosign verify | ✅ Verified |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed via:** Sigstore Fulcio (keyless — no private key stored)" >> $GITHUB_STEP_SUMMARY
